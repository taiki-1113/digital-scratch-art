<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10121a"><meta name="description" content="何度もこすって色を見つける、デジタルスクラッチアート。">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
  <title>こすってアート</title>
</head>
<body>
  <header class="topbar"><a class="brand" href="#" aria-label="こすってアート ホーム"><span class="brand-mark">✳</span><span>こすってアート</span></a><span class="top-note">ゆっくり、なんどでも。</span></header>
  <main>
    <section id="gallery" class="gallery-view">
      <div class="welcome"><div><p class="eyebrow">SCRATCH & DISCOVER</p><h1>なにを見つけよう？</h1><p class="intro">黒いところをこすると、絵の色が少しずつ見えてくるよ。</p></div><div class="sparkle" aria-hidden="true">✦</div></div>
      <div class="gallery-heading"><h2>えらべる作品</h2><span>オリジナル3点・ご指定素材10点</span></div>
      <div id="art-grid" class="art-grid"></div>
      <p class="gallery-foot">好きなところを好きなだけ。いつでも、とちゅうでやめて大丈夫。</p>
    </section>
    <section id="studio" class="studio-view" hidden>
      <div class="studio-head"><button id="back-button" class="back-button"><span aria-hidden="true">←</span> 作品一覧</button><div class="work-title"><span class="work-kicker">いまの作品</span><h1 id="work-name"></h1></div><button id="reset-button" class="reset-button" title="この作品の削り跡をリセット">はじめから</button></div>
      <div class="canvas-wrap" id="canvas-wrap"><div class="artboard" id="artboard"><canvas id="color-layer" width="900" height="650"></canvas><canvas id="scratch-layer" width="900" height="650"></canvas><canvas id="line-layer" width="900" height="650"></canvas><canvas id="debris-layer" width="900" height="650" aria-hidden="true"></canvas></div></div>
      <div class="studio-foot"><div class="instruction"><span class="hint-icon">✧</span><span>タッチペンで、すきなところをこすってみよう</span></div><div class="brush-controls" role="group" aria-label="削る太さ"><span>太さ</span><button type="button" data-brush="3" aria-pressed="false">細</button><button type="button" data-brush="6" aria-pressed="true">中</button><button type="button" data-brush="10" aria-pressed="false">太</button></div><span id="save-state" class="save-state">この端末に保存されます</span></div>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
