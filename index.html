<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10121a"><meta name="description" content="何度もこすって色を見つける、デジタルスクラッチアート。">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
  <title>こすってキラキラ！スクラッチアート</title>
</head>
<body>
  <header class="topbar"><a class="brand" href="#" aria-label="こすってキラキラ！スクラッチアート ホーム"><span class="brand-mark" aria-hidden="true">✳</span><span>こすってキラキラ！スクラッチアート</span></a><span class="top-note">ゆっくり、なんどでも。</span></header>
  <main>
    <section id="gallery" class="gallery-view">
      <div class="welcome"><div><p class="eyebrow">SCRATCH & DISCOVER</p><h1>なにを見つけよう？</h1><p class="intro">黒いところをこすると、絵の色が少しずつ見えてくるよ。</p></div><div class="sparkle" aria-hidden="true">✦</div></div>
      <div class="gallery-heading"><h2>えらべる作品</h2><span>オリジナル8点・ご指定素材10点</span></div>
      <div id="art-grid" class="art-grid"></div>
      <p class="gallery-foot">好きなところを好きなだけ。いつでも、とちゅうでやめて大丈夫。</p>
    </section>
    <section id="studio" class="studio-view" hidden>
      <div class="studio-head"><button id="back-button" class="back-button"><span aria-hidden="true">←</span> 作品一覧</button><div class="work-title"><span class="work-kicker">いまの作品</span><h1 id="work-name"></h1></div><button id="reset-button" class="reset-button" title="この作品の削り跡をリセット">はじめから</button></div>
      <div class="canvas-wrap" id="canvas-wrap"><div class="artboard" id="artboard"><canvas id="color-layer" width="900" height="650"></canvas><canvas id="scratch-layer" width="900" height="650"></canvas><canvas id="line-layer" width="900" height="650"></canvas><canvas id="debris-layer" width="900" height="650" aria-hidden="true"></canvas></div></div>
      <div class="studio-foot">
        <div class="view-controls" role="group" aria-label="絵の表示操作">
          <div class="view-buttons">
            <button type="button" id="zoom-out" aria-label="縮小" title="縮小" disabled>−</button>
            <button type="button" id="zoom-in" aria-label="拡大" title="拡大">＋</button>
            <button type="button" id="zoom-fit" aria-label="全体を表示" title="全体を表示" disabled>全体</button>
          </div>
          <div class="view-buttons">
            <button type="button" data-pan="left" aria-label="左を見る" title="左を見る" disabled>←</button>
            <button type="button" data-pan="up" aria-label="上を見る" title="上を見る" disabled>↑</button>
            <button type="button" data-pan="down" aria-label="下を見る" title="下を見る" disabled>↓</button>
            <button type="button" data-pan="right" aria-label="右を見る" title="右を見る" disabled>→</button>
          </div>
        </div>
        <span id="save-state" class="save-state" role="status">この端末に保存されます</span>
      </div>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
