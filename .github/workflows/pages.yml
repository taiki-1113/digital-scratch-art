name: Deploy digital scratch art to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css manifest.webmanifest sw.js .nojekyll _site/
          cp -R assets _site/assets
          cp -R "スクラッチアート作成用画像" _site/スクラッチアート作成用画像
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: _site
      - name: Wait for Pages artifact to be available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT"
          for attempt in {1..12}; do
            if count=$(gh api "$endpoint" --jq '.total_count') && [ "$count" = 1 ]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::The Pages artifact is not available after upload."
          exit 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
